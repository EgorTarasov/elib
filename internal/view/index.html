<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MISIS Elib Downloader</title>
    <style>
        :root {
            --primary-color: #1565c0;
            --primary-hover: #0d47a1;
            --background-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .instructions {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            margin-bottom: 1.5rem;
        }

        #elib-id {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            transition: border-color 0.3s;
        }

        #elib-id:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        #submit-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #submit-button:hover {
            background-color: var(--primary-hover);
        }

        #elib-result {
            min-height: 100px;
            padding: 1rem;
            border-radius: var(--border-radius);
        }

        .progress-indicator {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>MISIS Elib Downloader</h1>
    </header>

    <div class="card">
        <div class="instructions">
            <p>Для работы приложения надо перейти в электронную библиотеку МИСИС и выбрать необходимую книгу или документ, после чего вставить ссылку в поле ниже и нажать кнопку "Скачать".</p>
        </div>

        <div class="input-group">
            <input type="text" id="elib-id" placeholder="https://lib.msk.misis.ru/elib/view.php?id=2221">
            <button id="submit-button" onclick="download()">Скачать</button>
        </div>

        <div class="progress-indicator" id="progress">
            <div class="spinner"></div>
            <p>Загрузка документа...</p>
        </div>
    </div>

    <div class="card" id="elib-result">
        <!-- Results will appear here -->
    </div>

    <div class="footer">
        &copy; 2024 MISIS Elib Downloader
    </div>
</div>

<script>
    function getDocumentID(url) {
        try {
            let documentID = new URL(url).searchParams.get("id");
            return documentID;
        } catch (e) {
            return null;
        }
    }

    function download() {
        const urlInput = document.getElementById("elib-id").value;
        const resultArea = document.getElementById("elib-result");
        const progress = document.getElementById("progress");

        if (!urlInput) {
            resultArea.innerHTML = '<div style="color: red;">Пожалуйста, введите URL документа</div>';
            return;
        }

        const documentID = getDocumentID(urlInput);

        if (!documentID) {
            resultArea.innerHTML = '<div style="color: red;">Некорректный URL. Пожалуйста, введите правильную ссылку на документ</div>';
            return;
        }

        // Show loading indicator
        progress.style.display = 'block';
        resultArea.innerHTML = '';

        // Here you would add the actual API call to your backend
        // For now, just simulating with a timeout
        setTimeout(() => {
            progress.style.display = 'none';
            resultArea.innerHTML = `<p>Начата загрузка документа с ID: ${documentID}</p>`;
            // Add your actual download logic here
        }, 1500);
    }
</script>
</body>
</html>
